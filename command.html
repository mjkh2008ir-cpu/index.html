<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پدافند شبهات</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,sans-serif;background:#0d1408;color:#d4e8b0;padding:20px;direction:rtl}
.container{max-width:800px;margin:0 auto}
.header{text-align:center;border-bottom:2px solid #4a7c20;padding-bottom:10px;margin-bottom:20px}
.header h1{color:#6db33f}
.header span{color:#c8a000}
.post{background:#1a2410;border:1px solid #2e4018;padding:15px;margin-bottom:15px;border-radius:8px}
.post h3{color:#c8a000;margin-bottom:8px}
.post p{color:#d4e8b0;line-height:1.8}
.post .meta{color:#7a9a55;font-size:12px;margin-top:10px;border-top:1px solid #2e4018;padding-top:10px}
.footer{text-align:center;margin-top:30px;padding-top:15px;border-top:1px solid #2e4018;color:#7a9a55;font-size:12px}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🛡 <span>پدافند</span> شبهات</h1>
    <p>قرارگاه پاسخگویی به شبهات — مذهب شیعه اثناعشری</p>
  </div>

  <div id="posts"></div>

  <div class="footer">
    <p>🛡 پدافند شبهات؛ پاسخ به شبهات با مستندات معتبر</p>
    <p style="font-size:10px;color:#4a6a2a">«وَ مَا النَّصْرُ إِلَّا مِنْ عِندِ اللَّهِ»</p>
  </div>
</div>

<script>
// ===== بارگذاری مطالب =====
const BIN_ID = '6a771499da38895dfec99f53';
const API_KEY = '$2a$10$l235.uREI9OA0fWF4cxN0exlUw7Wcji0uj/0ieQni8JE/u85m1q3q';

async function loadPosts() {
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
      headers: { 'X-Master-Key': API_KEY }
    });
    const data = await res.json();
    const posts = data.record || [];
    renderPosts(posts);
  } catch(e) {
    document.getElementById('posts').innerHTML = '<p style="color:#c0392b;">⚠️ خطا در دریافت مطالب</p>';
  }
}

function renderPosts(posts) {
  const container = document.getElementById('posts');
  if (!posts || posts.length === 0) {
    container.innerHTML = '<p style="color:#7a9a55;">🔍 هنوز مطلبی ثبت نشده است.</p>';
    return;
  }
  container.innerHTML = posts.map(p => `
    <div class="post">
      <h3>❓ ${p.shobe || 'بدون عنوان'}</h3>
      <p>${(p.answer || 'پاسخی ثبت نشده').replace(/\n/g, '<br>')}</p>
      <div class="meta">
        ✍️ ${p.author || 'ناشناس'} 
        ${p.source ? `| 📖 ${p.source}` : ''}
        ${p.cat ? `| 🏷️ ${p.cat}` : ''}
      </div>
    </div>
  `).join('');
}

loadPosts();
</script>
</body>
</html>
